name: strict-pit
on: [push, pull_request]
jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [core, catalog, foundation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-pit*.txt
      - if: matrix.runtime == 'core'
        run: python -m pip install -r requirements-pit.txt
      - if: matrix.runtime == 'catalog'
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-pit-catalog.txt
      - if: matrix.runtime == 'foundation'
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-pit-foundation.txt
      - run: python -m pytest tests/test_pit_contract.py tests/test_pit_catalog.py tests/test_pit_foundation.py -q
