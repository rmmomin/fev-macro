name: strict-pit
on: [push, pull_request]
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-pit.txt
      - run: python -m pip install -r requirements-pit.txt
      - run: python -m pytest tests/test_pit_contract.py -q
